name: Lean formalisation

on:
  push:
    branches:
      - agent/formalise-bordered-jacobian
  pull_request:
    paths:
      - '**/*.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Restore Lean workspace cache
        uses: actions/cache@v5
        with:
          path: .lake/packages
          key: lean-packages-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}
      - name: Download Mathlib cache
        shell: bash
        run: |
          set +e
          lake exe cache get 2>&1 | tee cache.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('cache.log').read_text(errors='replace')[-30000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error file=lake-manifest.json::{text}')
          PY
          fi
          exit $status
      - name: Build
        shell: bash
        run: |
          set +e
          lake --wfail build 2>&1 | tee lean-build.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('lean-build.log').read_text(errors='replace')[-30000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error file=BorderedJacobian/Naturality.lean::{text}')
          PY
          fi
          exit $status
